# Config de github/labeler — etiqueta PRs según qué carpeta tocan.
# Mapeo de carpetas → módulo/capa: MAPEO_FRONTEND_CRM.md §18.
# Ojo: las rutas por módulo (app/contactos/, app/leads/, etc.) todavía no
# existen — nacen con T7. Hasta entonces, la mayoría de estos patrones
# simplemente no matchean nada, lo cual es correcto.

T0:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "tsconfig.json"
          - "next.config.ts"
          - "eslint.config.mjs"
          - ".gitignore"

T1:
  - changed-files:
      - any-glob-to-any-file:
          - "src/infrastructure/db/**"

T2:
  - changed-files:
      - any-glob-to-any-file:
          - "src/infrastructure/auth/**"

T7:
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/**"

T8:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"

