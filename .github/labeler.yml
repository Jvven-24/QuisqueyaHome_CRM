# Config de github/labeler — etiqueta PRs según qué carpeta tocan.
# Mapeo de carpetas → módulo/capa: MAPEO_FRONTEND_CRM.md §18.
# Las rutas por módulo viven bajo el grupo de rutas (crm), creado en T7: no
# aparece en la URL, pero sí en la ruta del archivo. Si un módulo se renombra,
# hay que tocarlo aquí, en .github/CODEOWNERS y en src/app/(crm)/modulos.ts.

T0:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "tsconfig.json"
          - "next.config.ts"
          - "eslint.config.mjs"
          - ".gitignore"

T1:
  - changed-files:
      - any-glob-to-any-file:
          - "src/infrastructure/db/**"

T2:
  - changed-files:
      - any-glob-to-any-file:
          - "src/infrastructure/auth/**"

T3:
  - changed-files:
      - any-glob-to-any-file:
          - "src/domain/rbac.ts"
          - "src/domain/rbac.test.ts"
          - "src/infrastructure/rbac-filter.ts"

T4:
  - changed-files:
      - any-glob-to-any-file:
          - "src/infrastructure/db/client.ts"
          - "src/infrastructure/http.ts"
          - "src/domain/errors.ts"
          - "src/application/**"

T7:
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/**"
          - "src/middleware.ts"

T8:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".env.example"
          - "src/infrastructure/env.ts"
          - "docs/DESPLIEGUE.md"

