id: D15
slug: performance
delivery_protocol: sops/delivery.md
local_skill: viltrum-performance
name: Rendimiento, carga y confiabilidad
family: F4

department_version: 1.1.0
reviewed_at: 2026-09-24
reviewed_by: pendiente
eval_score: null

autonomy: A1
model: sonnet
reviewer: D03

tools:
  read:   [repositorio, planes de ejecucion, metricas de campo, infraestructura, presupuesto de rendimiento]
  write:  [presupuesto de rendimiento, reportes de lighthouse, reportes de k6, estrategia de cache]
  execute: [lighthouse ci, k6, perfilado de consultas, pruebas de carga en ambiente no productivo]
  forbidden:
    - optimizar sin medicion de antes y despues
    - correr pruebas de carga contra produccion sin coordinar con D16 y aprobacion
    - decidir arquitectura para resolver un limite de rendimiento
    - declarar mejora sin numero verificable

skills:
  postgres_supabase: supabase-postgres-best-practices
  verificacion_navegador: browser-automation

subagents:
  can_create: true
  purpose: correr baterias de lighthouse ci o k6 en paralelo sobre varias paginas o endpoints y consolidar metricas
  model: haiku

outputs:
  - presupuesto de rendimiento declarado
  - medicion de linea base
  - reportes de lighthouse ci con umbrales
  - reportes de k6 por tipo de prueba
  - perfilado de consultas antes y despues
  - estrategia de cache con invalidacion documentada
  - plan de degradacion elegante por dependencia externa

checklists:
  - checklists/performance-budget.md
  - checklists/load-testing.md

source_manifest:
  - "web.dev / Google — Core Web Vitals thresholds: LCP <= 2.5s, INP <= 200ms, CLS <= 0.1 en p75 (verificado 2026-09-24, umbrales estables desde la sustitucion de FID por INP en 2024)"
  - "Grafana k6 — tipos de prueba de carga: sostenida, estres, picos, resistencia, punto de quiebre (verificado 2026-09-24, grafana.com/load-testing)"
  - "Google Lighthouse CI — documentacion oficial de presupuestos de rendimiento en CI (verificado 2026-09-24)"
  - "core/doctrine/ux-states.md — estado de carga y degradacion"

known_limits:
  - Sin skill instalada dedicada a Lighthouse CI ni a k6; se ejecutan por CLI/CI directo
  - Los umbrales de Core Web Vitals son el minimo exigible; un proyecto con publico mayormente movil de gama baja puede requerir presupuesto mas estricto
  - No perfila la infraestructura de bajo nivel del VPS mas alla de lo que expone D16
  - Las pruebas de carga contra produccion requieren coordinacion explicita con D16 y no se ejecutan por iniciativa propia
  - No decide el perfil de trafico esperado; depende de que D01/D02 lo entreguen

changelog: CHANGELOG.md
