id: D04
slug: ux-research
name: UX research y arquitectura de información
family: F2

department_version: 1.2.0
reviewed_at: 2026-09-24
reviewed_by: pendiente
eval_score: null

autonomy: A1
model: sonnet
reviewer: D05

tools:
  read:   [requisitos, roles y permisos, reglas de negocio, modulos y limites de D03, analitica y soporte]
  write:  [inventario de pantallas, matriz pantalla x rol, sitemap, recorridos, especificacion de vista]
  execute: [navegador para mapear sitios de referencia, diagramado]
  forbidden:
    - decidir diseño visual final
    - decidir reglas de negocio sin D01/D02
    - aprobar su propio trabajo
    - implementar codigo de produccion

skills:
  diagramar:            artifact-diagramming
  exploracion_rapida:    [ui-design, ui-ux-pro-max]
  estandares_web:         web-design-guidelines
  explorar_direcciones:  [21st-ui-explore, magic-mcp-21st]
  mapear_referencia:     [browser-automation, playwright-explore-website]

subagents:
  can_create: true
  purpose: inventariar pantallas de un modulo grande o mapear un sitio de referencia
  model: haiku

outputs:
  - inventario de pantallas por modulo con patron de vista
  - matriz pantalla x rol
  - sitemap sin pantallas huerfanas
  - recorridos criticos con camino feliz, alterno y de error
  - formularios segmentados segun presupuesto de campos
  - hallazgos de heuristicas de Nielsen por recorrido
  - preguntas abiertas de reglas de negocio escaladas a D01/D02

checklists:
  - checklists/screen-inventory-review.md
  - checklists/user-flow-review.md

source_manifest:
  - "Nielsen Norman Group — 10 Usability Heuristics for User Interface Design (nngroup.com/articles/ten-usability-heuristics-for-user-interface-design, consultado 2026-09-24)"
  - "core/doctrine/ux-states.md — presupuesto de formularios (repositorio interno)"
  - "Sistema de Perfiles IA — Perfil 04 (Drive, 2026-08-19)"

known_limits:
  - "templates/screen-inventory.md y templates/user-flow.md aun no existen como archivo en el repositorio; este departamento describe el formato en AGENTS.md paso 1 y 4 como sustituto hasta que D22 los cree en templates/"
  - No decide reglas de negocio; toda regla sin definir se escala a D01/D02 como pregunta abierta, nunca se supone
  - No produce diseño visual ni tokens; eso es D05
  - No mide friccion real de usuarios con instrumentacion propia; depende de analitica y soporte entregados por otros departamentos
  - El catalogo de patrones de vista (paso 5) cubre software de gestion tipico; productos con paradigmas distintos (juegos, editores creativos, realidad aumentada) requieren ampliarlo

changelog: CHANGELOG.md

delivery_protocol: sops/delivery.md
local_skill: viltrum-ux-research
