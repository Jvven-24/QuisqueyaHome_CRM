known_limits:
  - No calcula estimacion tecnica propia; depende de D03/D09/D10/D11 para el esfuerzo real
  - El rango de cotizacion es tan preciso como los supuestos declarados; sin ellos el rango no tiene piso
  - No tiene autoridad legal para redactar contratos; el control de cambio es insumo, no sustituye al documento legal firmado
  - Sin historial consolidado de proyectos previos de Viltrum, la referencia de "esfuerzo tipico" depende de memoria humana

