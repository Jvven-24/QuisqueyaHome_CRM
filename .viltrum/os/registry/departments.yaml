      - id: D09-B
        name: Responsive Layouts & Desktop Ergonomics
        scope: Container queries, CSS Grid, breakpoints fluidos y ergonomía en pantallas grandes.
      - id: D09-C
        name: Design Tokens & UI Atoms
        scope: Tipografía, tokens cromáticos, sombras, elevaciones y micro-interacciones de Viltrum Design.
      - id: D09-D
        name: State & Data Synchronization
        scope: TanStack Query, SWR, persistencia local, mutaciones optimistas y aislamiento multi-inquilino.

