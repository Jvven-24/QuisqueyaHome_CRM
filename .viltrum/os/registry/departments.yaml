      - id: D03-B
        name: Contratos de Integración & Protocolos
        scope: OpenAPI 3.1, tRPC, Idempotency-Keys, esquemas Zod compartidos y versionado semántico de contratos.
      - id: D03-C
        name: Concurrencia, Caching & Consistencia
        scope: Split-brain mitigation, Distributed locks, Invalidación reactiva de caché, ETags y SWR en tres niveles.

  - id: D09
